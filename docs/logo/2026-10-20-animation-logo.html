<title>Logo Invest Law animé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap">
<style>
/* Une scène centrée : le logo sur son fond de marque, commandes sous la scène */
:root { --bg:#E4E8EE; --fg:#2E3B48; --muted:#5E6B78; --stage:#EFF1F4; --accent:#60A0BE; --line:#CDD4DD;
  --sans: Montserrat, "Helvetica Neue", Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1B232C; --fg:#E6EBF0; --muted:#9AA8B5; --line:#33404D; color-scheme: dark } }
:root[data-theme="dark"] { --bg:#1B232C; --fg:#E6EBF0; --muted:#9AA8B5; --line:#33404D; color-scheme: dark }
body { background:var(--bg); color:var(--fg); font-family:var(--sans); }
main { max-width:760px; margin:0 auto; padding-block:40px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:grid; gap:20px; }
h1 { font-weight:500; font-size:1.25rem; margin:0; text-wrap:balance; }
p { margin:0; color:var(--muted); line-height:1.55; max-width:65ch; }
.stage { background:var(--stage); border-radius:6px; padding:clamp(24px,8vw,72px); display:grid; place-items:center; }
.stage svg { width:100%; max-width:480px; height:auto; display:block; }
.bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
button { font:inherit; font-size:.9rem; padding:9px 16px; border-radius:4px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#0F2230; font-weight:500; }
button[aria-pressed="true"] { border-color:var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.lbl { font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-left:8px; }
</style>
<main>
  <h1>Apparition du logo Invest Law</h1>
  <div class="stage" id="stage">
<svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 196" role="img" aria-labelledby="il-t">
  <title id="il-t">Invest Law</title>
  <style>
    svg { --k: 1; }
    .il-txt { font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; font-size: 60px; fill: #425262; }
    .il-blue, .il-dark, .il-word, .il-sweep { animation-fill-mode: both; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
    .il-blue  { animation-name: il-in-top; animation-duration: calc(.75s * var(--k)); }
    .il-dark  { animation-name: il-in-bot; animation-duration: calc(.75s * var(--k)); animation-delay: calc(.22s * var(--k)); }
    .il-mark  { transform-origin: 64px 90px; animation: il-settle calc(.5s * var(--k)) calc(.85s * var(--k)) ease-out both; }
    .il-w1    { animation-name: il-rise; animation-duration: calc(.8s * var(--k)); animation-delay: calc(.8s * var(--k)); }
    .il-w2    { animation-name: il-rise; animation-duration: calc(.8s * var(--k)); animation-delay: calc(1.02s * var(--k)); }
    .il-s1    { animation-name: il-sweep; animation-duration: calc(.9s * var(--k)); animation-delay: calc(.8s * var(--k)); }
    .il-s2    { animation-name: il-sweep; animation-duration: calc(.9s * var(--k)); animation-delay: calc(1.02s * var(--k)); }
    @keyframes il-in-top { from { opacity: 0; transform: translate(30px,-30px); } to { opacity: 1; transform: none; } }
    @keyframes il-in-bot { from { opacity: 0; transform: translate(30px,30px); } to { opacity: 1; transform: none; } }
    @keyframes il-settle { 0% { transform: scale(1); } 40% { transform: scale(.965); } 100% { transform: scale(1); } }
    @keyframes il-rise { from { transform: translateX(-10px); } to { transform: none; } }
    @keyframes il-sweep { from { transform: translateX(-300px); } to { transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="il-g" x1="0" x2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="il-m1" maskUnits="userSpaceOnUse" x="0" y="0" width="370" height="196"><rect class="il-sweep il-s1" x="100" y="20" width="300" height="70" fill="url(#il-g)"/></mask>
    <mask id="il-m2" maskUnits="userSpaceOnUse" x="0" y="0" width="370" height="196"><rect class="il-sweep il-s2" x="100" y="96" width="300" height="70" fill="url(#il-g)"/></mask>
  </defs>
  <g class="il-mark">
    <path class="il-blue" fill="#60A0BE" d="M38 106V73L80.5 30.5Q83.5 27.5 86.5 30.5Q89.5 33.5 89.5 40V54.5Z"/>
    <path class="il-dark" fill="#425262" d="M54.5 89.5L89.5 124.5V141Q89.5 147.5 86 151Q82.5 154 79.5 150.5L37.5 106.5Z"/>
  </g>
  <g mask="url(#il-m1)"><text class="il-txt il-word il-w1" x="111" y="81.5" textLength="236" lengthAdjust="spacingAndGlyphs">INVEST</text></g>
  <g mask="url(#il-m2)"><text class="il-txt il-word il-w2" x="111" y="152.5" textLength="145" lengthAdjust="spacingAndGlyphs">LAW</text></g>
</svg>

  </div>
  <div class="bar">
    <button class="primary" id="replay">Rejouer</button>
    <span class="lbl">Vitesse</span>
    <button id="k1" aria-pressed="true" data-k="1">Normale</button>
    <button id="k3" aria-pressed="false" data-k="3">Ralentie ×3</button>
  </div>
  <p>Le chevron bleu descend en diagonale, la pièce ardoise remonte à sa rencontre, le signe se resserre au contact, puis INVEST et LAW se dévoilent de gauche à droite. Durée totale : 1,9 s. Fichier SVG autonome dans le dépôt : docs/logo/invest-law-logo-anime.svg.</p>
</main>
<script>
let k = 1;
function play() {
  const old = document.getElementById('logo'), n = old.cloneNode(true);
  n.style.setProperty('--k', k); old.replaceWith(n);
}
document.getElementById('replay').addEventListener('click', play);
document.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
  k = +b.dataset.k;
  document.querySelectorAll('[data-k]').forEach(x => x.setAttribute('aria-pressed', x === b));
  play();
}));
</script>
