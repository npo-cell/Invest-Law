<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 196" role="img" aria-labelledby="il2-t">
  <title id="il2-t">Invest Law</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400&amp;display=swap");
    svg { --k: 1; }
    text { font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; font-size: 60px; }
    .il2-l { fill: #425262; animation: il2-letter calc(.7s * var(--k)) calc(var(--d) * var(--k)) cubic-bezier(.34,1.56,.64,1) both; }
    .il2-trace { fill: none; stroke-width: 1.4; stroke-linejoin: round; stroke-dasharray: 1; animation: il2-trace calc(.75s * var(--k)) ease-in-out both; }
    .il2-fill { animation: il2-fill calc(.35s * var(--k)) calc(.95s * var(--k)) ease-out both; }
    .il2-top { animation: il2-top calc(.5s * var(--k)) calc(.55s * var(--k)) cubic-bezier(.7,0,.84,0) both; }
    .il2-bot { animation: il2-bot calc(.5s * var(--k)) calc(.55s * var(--k)) cubic-bezier(.7,0,.84,0) both; }
    .il2-mark { transform-origin: 64px 90px; animation: il2-impact calc(.6s * var(--k)) calc(1.05s * var(--k)) cubic-bezier(.3,1.6,.5,1) both; }
    .il2-ring { fill: none; stroke: #60A0BE; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: il2-ring calc(1.1s * var(--k)) calc(1.05s * var(--k)) cubic-bezier(.1,.7,.3,1) both; }
    .il2-ring2 { stroke: #425262; animation-delay: calc(1.18s * var(--k)); }
    .il2-sheen { animation: il2-sheen calc(1s * var(--k)) calc(2.15s * var(--k)) ease-in-out both; }
    @keyframes il2-trace { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes il2-fill { from { fill-opacity: 0; } to { fill-opacity: 1; } }
    @keyframes il2-top { from { transform: translate(34px,-34px); } to { transform: none; } }
    @keyframes il2-bot { from { transform: translate(34px,34px); } to { transform: none; } }
    @keyframes il2-impact { 0% { transform: scale(1); } 30% { transform: scale(.92); } 100% { transform: scale(1); } }
    @keyframes il2-ring { 0% { opacity: 0; transform: scale(.05); } 6% { opacity: .7; } 100% { opacity: 0; transform: scale(1); } }
    @keyframes il2-letter { from { opacity: 0; transform: translateY(26px); } 40% { opacity: 1; } to { opacity: 1; transform: none; } }
    @keyframes il2-sheen { from { transform: translateX(-120px); } to { transform: translateX(460px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .il2-trace, .il2-ring, .il2-sheen { display: none; } }
  </style>
  <defs>
    <clipPath id="il2-c1"><rect x="0" y="0" width="370" height="88"/></clipPath>
    <clipPath id="il2-c2"><rect x="0" y="88" width="370" height="108"/></clipPath>
    <linearGradient id="il2-sg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="il2-sm" maskUnits="userSpaceOnUse" x="0" y="0" width="370" height="196">
      <g fill="#fff"><path d="M38 106V73L80.5 30.5Q83.5 27.5 86.5 30.5Q89.5 33.5 89.5 40V54.5Z"/><path d="M54.5 89.5L89.5 124.5V141Q89.5 147.5 86 151Q82.5 154 79.5 150.5L37.5 106.5Z"/><g transform="translate(111 81.5) scale(1.0834 1)"><text>I</text></g><g transform="translate(130.63 81.5) scale(1.0834 1)"><text>N</text></g><g transform="translate(182.49 81.5) scale(1.0834 1)"><text>V</text></g><g transform="translate(226.88 81.5) scale(1.0834 1)"><text>E</text></g><g transform="translate(270.36 81.5) scale(1.0834 1)"><text>S</text></g><g transform="translate(309.69 81.5) scale(1.0834 1)"><text>T</text></g><g transform="translate(111 152.5) scale(1.015 1)"><text>L</text></g><g transform="translate(146.87 152.5) scale(1.015 1)"><text>A</text></g><g transform="translate(188.34 152.5) scale(1.015 1)"><text>W</text></g></g>
    </mask>
  </defs>
  <circle class="il2-ring" cx="38" cy="106" r="120"/>
  <circle class="il2-ring il2-ring2" cx="38" cy="106" r="85"/>
  <g class="il2-mark">
    <g class="il2-top">
      <path class="il2-fill" fill="#60A0BE" d="M38 106V73L80.5 30.5Q83.5 27.5 86.5 30.5Q89.5 33.5 89.5 40V54.5Z"/>
      <path class="il2-trace" stroke="#60A0BE" pathLength="1" d="M38 106V73L80.5 30.5Q83.5 27.5 86.5 30.5Q89.5 33.5 89.5 40V54.5Z"/>
    </g>
    <g class="il2-bot">
      <path class="il2-fill" fill="#425262" d="M54.5 89.5L89.5 124.5V141Q89.5 147.5 86 151Q82.5 154 79.5 150.5L37.5 106.5Z"/>
      <path class="il2-trace" stroke="#425262" pathLength="1" d="M54.5 89.5L89.5 124.5V141Q89.5 147.5 86 151Q82.5 154 79.5 150.5L37.5 106.5Z"/>
    </g>
  </g>
  <g clip-path="url(#il2-c1)"><g transform="translate(111 81.5) scale(1.0834 1)"><text class="il2-l" style="--d:1.30s">I</text></g><g transform="translate(130.63 81.5) scale(1.0834 1)"><text class="il2-l" style="--d:1.37s">N</text></g><g transform="translate(182.49 81.5) scale(1.0834 1)"><text class="il2-l" style="--d:1.44s">V</text></g><g transform="translate(226.88 81.5) scale(1.0834 1)"><text class="il2-l" style="--d:1.51s">E</text></g><g transform="translate(270.36 81.5) scale(1.0834 1)"><text class="il2-l" style="--d:1.58s">S</text></g><g transform="translate(309.69 81.5) scale(1.0834 1)"><text class="il2-l" style="--d:1.65s">T</text></g></g>
  <g clip-path="url(#il2-c2)"><g transform="translate(111 152.5) scale(1.015 1)"><text class="il2-l" style="--d:1.62s">L</text></g><g transform="translate(146.87 152.5) scale(1.015 1)"><text class="il2-l" style="--d:1.69s">A</text></g><g transform="translate(188.34 152.5) scale(1.015 1)"><text class="il2-l" style="--d:1.76s">W</text></g></g>
  <g mask="url(#il2-sm)"><g class="il2-sheen"><rect x="-40" y="0" width="46" height="196" fill="url(#il2-sg)" transform="skewX(-20)"/></g></g>
</svg>
